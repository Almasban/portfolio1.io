<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Weather App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f172a;
  --card: rgba(20,20,30,0.4);
  --accent:#7c3aed;
  --text: rgba(255,255,255,0.85);
  --glass-bg: rgba(255,255,255,0.07);
}

* {box-sizing:border-box;margin:0;padding:0;}
body {
  font-family:'Poppins',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
canvas#rainCanvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:0;
}
.container {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 20px;
}
h1 {margin-bottom:20px;color:#fff;}
.card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:25px;
  margin:15px 0;
  width:100%;
  max-width:400px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  text-align:center;
  transition: transform 0.3s ease;
}
.card:hover {transform: translateY(-4px);}
input[type=text] {
  width:65%;
  padding:10px 12px;
  border-radius:12px;
  border:none;
  outline:none;
  background: rgba(255,255,255,0.05);
  color:#fff;
  margin-bottom:10px;
}
.btn.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 12px;
  padding:8px 14px;
  cursor:pointer;
  transition: all 0.3s ease;
  margin-left:6px;
}
.btn.glass:hover {background: rgba(255,255,255,0.12); transform:translateY(-2px);}
#weatherResult, #forecastContainer, #detailsContainer {
  margin-top:12px;
  line-height:1.5;
  text-align:left;
}
#historyBtns {margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
.historyBtn {padding:4px 10px; border-radius:10px; border:none; background: rgba(255,255,255,0.05); color:#fff; cursor:pointer; font-size:13px;}
.historyBtn:hover {background: rgba(255,255,255,0.12);}
footer {text-align:center; color: rgba(255,255,255,0.5); margin-top:30px; font-size:14px;}
@media(max-width:480px){
  input[type=text]{width:100%; margin-bottom:8px;}
  .btn.glass{margin-left:0; margin-top:6px;}
}
</style>
</head>
<body>

<canvas id="rainCanvas"></canvas>

<div class="container">
  <h1>Advanced Weather App</h1>

  <!-- Search Card -->
  <div class="card">
    <input type="text" id="cityInput" placeholder="Enter city">
    <button id="getWeather" class="btn glass">Check</button>
    <button id="unitToggle" class="btn glass">°C / °F</button>
    <div id="historyBtns"></div>
  </div>

  <!-- Current Weather Card -->
  <div class="card" id="weatherCard">
    <div id="weatherResult">Search for a city to see current weather.</div>
  </div>

  <!-- Forecast Card -->
  <div class="card" id="forecastContainer"></div>

  <!-- Detailed Metrics Card -->
  <div class="card" id="detailsContainer"></div>
</div>

<footer>© 2025 Your Name — Advanced Weather App Project</footer>

<script>
// ======= Rainy Background =======
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

class Drop {
  constructor(){ this.reset(true); }
  reset(init=false){
    this.x=Math.random()*canvas.width;
    this.y=init? Math.random()*canvas.height : -20-Math.random()*50;
    this.vy=2+Math.random()*3;
    this.len=8+Math.random()*12;
    this.opacity=0.1+Math.random()*0.2;
  }
  step(){ this.y+=this.vy; if(this.y>canvas.height)this.reset(); }
  draw(){ctx.beginPath(); ctx.strokeStyle=`rgba(180,220,255,${this.opacity})`; ctx.lineWidth=1; ctx.moveTo(this.x,this.y); ctx.lineTo(this.x,this.y+this.len); ctx.stroke();}
}
const drops=[];
for(let i=0;i<120;i++) drops.push(new Drop());
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height); drops.forEach(d=>{d.step();d.draw();}); requestAnimationFrame(animate);}
animate();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

// ======= Weather App Logic =======
const apiKey="YOUR_API_KEY"; // Replace with OpenWeatherMap API key
const cityInput = document.getElementById("cityInput");
const getWeather = document.getElementById("getWeather");
const unitToggle = document.getElementById("unitToggle");
const weatherResult = document.getElementById("weatherResult");
const forecastContainer = document.getElementById("forecastContainer");
const detailsContainer = document.getElementById("detailsContainer");
const historyBtnsDiv = document.getElementById("historyBtns");

let unit="metric"; // metric = °C, imperial = °F
let searchHistory = JSON.parse(localStorage.getItem("weatherHistory"))||[];

// Render search history
function renderHistory(){
  historyBtnsDiv.innerHTML="";
  searchHistory.forEach(city=>{
    const btn=document.createElement('button');
    btn.className="historyBtn";
    btn.textContent=city;
    btn.onclick=()=>{cityInput.value=city; fetchWeather(city);}
    historyBtnsDiv.appendChild(btn);
  });
}

// Toggle unit
unitToggle.addEventListener('click',()=>{unit=unit==="metric"?"imperial":"metric"; if(cityInput.value) fetchWeather(cityInput.value);});

// Fetch Weather
getWeather.addEventListener('click',()=>{const city=cityInput.value.trim(); if(!city) return alert("Enter a city"); fetchWeather(city);});

async function fetchWeather(city){
  weatherResult.innerHTML="Loading...";
  forecastContainer.innerHTML="";
  detailsContainer.innerHTML="";
  try{
    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=${unit}&appid=${apiKey}`);
    const data = await res.json();
    if(data.cod!==200) throw new Error(data.message);

    // Save history
    if(!searchHistory.includes(city)){ searchHistory.unshift(city); if(searchHistory.length>5) searchHistory.pop(); localStorage.setItem("weatherHistory", JSON.stringify(searchHistory)); }
    renderHistory();

    // Current weather
    weatherResult.innerHTML=`
      <strong>${data.name}, ${data.sys.country}</strong><br>
      ${data.weather[0].description}<br>
      🌡 Temp: ${data.main.temp}${unit==="metric"?"°C":"°F"} | Feels like: ${data.main.feels_like}${unit==="metric"?"°C":"°F"}<br>
      💧 Humidity: ${data.main.humidity}% | 💨 Wind: ${data.wind.speed} m/s
    `;

    // Details
    const sunrise=new Date(data.sys.sunrise*1000).toLocaleTimeString();
    const sunset=new Date(data.sys.sunset*1000).toLocaleTimeString();
    detailsContainer.innerHTML=`
      🌅 Sunrise: ${sunrise}<br>
      🌇 Sunset: ${sunset}<br>
      ⚡ Pressure: ${data.main.pressure} hPa<br>
      Visibility: ${data.visibility/1000} km
    `;

    // 3-day Forecast
    const lat=data.coord.lat, lon=data.coord.lon;
    const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=current,minutely,hourly,alerts&units=${unit}&appid=${apiKey}`);
    const forecastData = await forecastRes.json();
    let forecastHTML="<h3 style='color:#fff;text-align:center;'>3-Day Forecast</h3>";
    for(let i=1;i<=3;i++){
      const day=forecastData.daily[i];
      const dt=new Date(day.dt*1000).toLocaleDateString();
      forecastHTML+=`<div style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
        <strong>${dt}</strong><br>
        ${day.weather[0].description}<br>
        🌡 Day: ${day.temp.day}${unit==="metric"?"°C":"°F"} | Night: ${day.temp.night}${unit==="metric"?"°C":"°F"}
      </div>`;
    }
    forecastContainer.innerHTML=forecastHTML;

  }catch(err){
    weatherResult.innerHTML=`Error: ${err.message}`;
  }
}
renderHistory();
</script>

</body>
</html>
