<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Advanced To-Do App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f172a;
  --card: rgba(20,20,30,0.4);
  --accent:#7c3aed;
  --text: rgba(255,255,255,0.85);
  --glass-bg: rgba(255,255,255,0.07);
  --high: #f87171;  /* red */
  --medium: #facc15; /* yellow */
  --low: #34d399;    /* green */
}

body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x:hidden;
}

canvas#rainCanvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:0;
}

.container {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px 20px;
  min-height:100vh;
  box-sizing:border-box;
}

h1 {margin-bottom:20px; color:#fff;}

.card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:25px;
  margin:15px 0;
  width:100%;
  max-width:600px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  transition: transform 0.3s ease;
}
.card:hover { transform: translateY(-4px); }

input, select {
  padding:8px 10px;
  border-radius:10px;
  border:none;
  outline:none;
  background: rgba(255,255,255,0.05);
  color:#fff;
  margin-right:6px;
  margin-bottom:6px;
}

.btn.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
  border-radius:12px;
  padding:6px 12px;
  cursor:pointer;
  transition: all 0.3s ease;
}

.btn.glass:hover { background: rgba(255,255,255,0.12); transform:translateY(-2px); }

ul#todoList {
  list-style:none;
  padding-left:0;
  margin-top:12px;
}

li {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  flex-wrap:wrap;
}

.priority {
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
  margin-right:6px;
}

footer {text-align:center; color: rgba(255,255,255,0.5); margin-top:30px; font-size:14px;}

@media(max-width:480px){
  input, select{ width:100%; margin-bottom:6px; }
}
</style>
</head>
<body>

<canvas id="rainCanvas"></canvas>

<div class="container">
  <h1>Professional Advanced To-Do App</h1>

  <!-- Dashboard Card -->
  <div class="card" id="dashboardCard">
    <p>Total Tasks: <span id="totalTasks">0</span> | Completed: <span id="completedTasks">0</span> | Pending: <span id="pendingTasks">0</span></p>
  </div>

  <!-- Task Input Card -->
  <div class="card">
    <input type="text" id="todoInput" placeholder="New task...">
    <select id="categorySelect">
      <option value="General">General</option>
      <option value="Work">Work</option>
      <option value="Personal">Personal</option>
      <option value="Study">Study</option>
    </select>
    <select id="prioritySelect">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
    <input type="date" id="dueDate">
    <button id="addTodo" class="btn glass">Add Task</button>
  </div>

  <!-- Filters -->
  <div class="card">
    <button class="btn glass" onclick="filterTasks('all')">All</button>
    <button class="btn glass" onclick="filterTasks('active')">Active</button>
    <button class="btn glass" onclick="filterTasks('completed')">Completed</button>
  </div>

  <!-- Task List -->
  <div class="card">
    <ul id="todoList"></ul>
  </div>
</div>

<footer>© 2025 Your Name — Advanced To-Do App Project</footer>

<script>
// ======= Rainy Background =======
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

class Drop {
  constructor(){ this.reset(true); }
  reset(init=false){
    this.x=Math.random()*canvas.width;
    this.y=init? Math.random()*canvas.height : -20-Math.random()*50;
    this.vy=2+Math.random()*3;
    this.len=8+Math.random()*12;
    this.opacity=0.1+Math.random()*0.2;
  }
  step(){ this.y+=this.vy; if(this.y>canvas.height)this.reset(); }
  draw(){ctx.beginPath(); ctx.strokeStyle=`rgba(180,220,255,${this.opacity})`; ctx.lineWidth=1; ctx.moveTo(this.x,this.y); ctx.lineTo(this.x,this.y+this.len); ctx.stroke();}
}

const drops=[];
for(let i=0;i<120;i++) drops.push(new Drop());

function animate(){ctx.clearRect(0,0,canvas.width,canvas.height); drops.forEach(d=>{d.step();d.draw();}); requestAnimationFrame(animate);}
animate();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

// ======= To-Do App Logic =======
const todoInput = document.getElementById('todoInput');
const addTodoBtn = document.getElementById('addTodo');
const todoList = document.getElementById('todoList');
const categorySelect = document.getElementById('categorySelect');
const prioritySelect = document.getElementById('prioritySelect');
const dueDateInput = document.getElementById('dueDate');

const totalTasksSpan = document.getElementById('totalTasks');
const completedTasksSpan = document.getElementById('completedTasks');
const pendingTasksSpan = document.getElementById('pendingTasks');

let todos = JSON.parse(localStorage.getItem('advancedTodos')) || [];
let filter = 'all';

// Render dashboard stats
function renderStats(){
  totalTasksSpan.textContent = todos.length;
  completedTasksSpan.textContent = todos.filter(t=>t.completed).length;
  pendingTasksSpan.textContent = todos.filter(t=>!t.completed).length;
}

// Render tasks
function renderTodos(){
  todoList.innerHTML='';
  todos.forEach((task,index)=>{
    if(filter==='active' && task.completed) return;
    if(filter==='completed' && !task.completed) return;

    const li = document.createElement('li');
    const due = task.due ? new Date(task.due) : null;
    const now = new Date();
    const overdue = due && now > due && !task.completed;

    li.innerHTML=`
      <div style="flex:1; display:flex; flex-direction:column;">
        <div><span class="priority" style="background:${task.priority==='High'? 'var(--high)':task.priority==='Medium'? 'var(--medium)':'var(--low)'}"></span>
        <strong>${task.text}</strong> <em>(${task.category})</em></div>
        <div style="font-size:12px; color:${overdue?'#f87171':'#ccc'};">${task.due? 'Due: '+task.due : ''}</div>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn glass" style="padding:2px 6px;font-size:11px;" onclick="toggleComplete(${index})">${task.completed?'Undo':'Done'}</button>
        <button class="btn glass" style="padding:2px 6px;font-size:11px;" onclick="deleteTodo(${index})">Delete</button>
      </div>
    `;
    todoList.appendChild(li);
  });
  renderStats();
  localStorage.setItem('advancedTodos', JSON.stringify(todos));
}

function addTodo(){
  const text = todoInput.value.trim();
  if(!text) return;
  todos.push({
    text,
    category: categorySelect.value,
    priority: prioritySelect.value,
    due: dueDateInput.value,
    completed: false
  });
  todoInput.value=''; dueDateInput.value='';
  renderTodos();
}

function deleteTodo(index){ todos.splice(index,1); renderTodos(); }
function toggleComplete(index){ todos[index].completed=!todos[index].completed; renderTodos(); }
function filterTasks(f){ filter=f; renderTodos(); }

addTodoBtn.addEventListener('click', addTodo);
todoInput.addEventListener('keypress', e=>{ if(e.key==='Enter') addTodo(); });

renderTodos();
</script>
